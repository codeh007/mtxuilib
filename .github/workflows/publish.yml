name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify tag matches package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${expected_tag}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Pack npm tarball
        id: pack
        run: |
          mkdir -p .artifacts
          tarball="$(npm pack --pack-destination .artifacts)"
          echo "tarball=.artifacts/${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: true
